name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize flat files into Flutter folders
        run: |
          mkdir -p assets lib/theme lib/models lib/services lib/widgets lib/screens android/app/src/main ios/Runner
          for f in catalog_seed.json soundcheck.json soundcheck.mp3 mark.png; do [ -f "$f" ] && mv "$f" assets/; done
          [ -f main.dart ] && mv main.dart lib/
          [ -f studio_theme.dart ] && mv studio_theme.dart lib/theme/
          [ -f studio_models.dart ] && mv studio_models.dart lib/models/
          for f in audio_engine.dart openrouter_service.dart script_splitter.dart studio_controller.dart; do [ -f "$f" ] && mv "$f" lib/services/; done
          for f in audio_monitor_card.dart script_editor_card.dart settings_sheet.dart voice_settings_card.dart; do [ -f "$f" ] && mv "$f" lib/widgets/; done
          for f in home_shell.dart projects_screen.dart; do [ -f "$f" ] && mv "$f" lib/screens/; done
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml android/app/src/main/
          [ -f Info.plist ] && mv Info.plist ios/Runner/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android Gradle scaffolding
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.fishnarrator --project-name fish_narrator_mobile .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24 for FFmpegKit
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishNarrator-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
