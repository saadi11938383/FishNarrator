name: fish_narrator_mobile
description: FishNarrator Studio 2.0 — Mobile Flutter edition for OpenRouter free speech narration.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.40
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  archive: ^3.6.1
  url_launcher: ^6.3.1
  ffmpeg_kit_flutter_new: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog_seed.json
    - assets/soundcheck.mp3
    - assets/soundcheck.json
    - assets/mark.png
